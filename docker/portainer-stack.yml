# Portainer stack for Replex with per-user resolution restrictions,
# exposed via a Cloudflare Tunnel (no open inbound ports on the VPS).
#
# Deploy: Portainer -> Stacks -> Add stack -> Web editor, paste this file.
#
# Secrets live in the stack's Environment variables tab, never inline here.
#
# One-time Cloudflare setup (dashboard):
#   1. Zero Trust -> Networks -> Tunnels -> Create a tunnel (cloudflared)
#   2. Copy the tunnel token
#   3. Public hostname: replex.yourdomain.com -> HTTP -> replex:80
#   4. Security -> Bots: disable Bot Fight Mode (Plex clients get challenged
#      otherwise) and avoid WAF rules that challenge this hostname.

services:
  replex:
    build:
      context: https://github.com/LJAM96/replex.git#main
      dockerfile: docker/Dockerfile
    container_name: replex
    restart: unless-stopped
    # No published ports: the only path in is through the tunnel.
    environment:
      # --- upstream Plex ---
      REPLEX_HOST: ${REPLEX_HOST}
      REPLEX_TOKEN: ${REPLEX_TOKEN}

      # --- per-user resolution restrictions ---
      REPLEX_RESOLUTION_POLICY_ENABLED: "true"
      REPLEX_RESOLUTION_DEFAULT: "unlimited"
      REPLEX_RESOLUTION_POLICY_FAIL_CLOSED: "true"
      REPLEX_HIDDEN_COLLECTIONS: ${REPLEX_HIDDEN_COLLECTIONS}
      REPLEX_USER_RESOLUTION_POLICIES: >-
        ${REPLEX_USER_RESOLUTION_POLICIES}

      # --- presentation / playback behaviour ---
      RELEX_INTERLEAVE: "true"
      RELEX_HUB_RESTRICTIONS: "true"
      RELEX_AUTO_SELECT_VERSION: "true"
      RELEX_HERO_ROWS: "home.continue"

      # --- transport ---
      REPLEX_REDIRECT_STREAMS: "true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: replex-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - replex

# ----------------------------------------------------------------------
# Required environment variables (Portainer stack -> Environment variables):
#
#   REPLEX_HOST   = https://65-109-70-216.4415a7984eac4dd580d29c97add2d630.plex.direct:42442
#   REPLEX_TOKEN  = <your admin plex token>
#   TUNNEL_TOKEN  = <token from Cloudflare Zero Trust tunnel>
#
#   REPLEX_USER_RESOLUTION_POLICIES =
#   [{"username":"jodiemy3","max_resolution":"1080","visible_collections":["🎀Jodie"]},
#    {"username":"Luke.Mulvaney","max_resolution":"unlimited"}]
#
#   REPLEX_HIDDEN_COLLECTIONS = 🎀Jodie
# ----------------------------------------------------------------------
#
# Notes:
# - Video bytes never traverse the tunnel: stream redirection sends clients
#   straight to the bare-metal Plex server for media data.
# - After deploy + tunnel hostname configured, set Plex's Custom server
#   access URL to https://replex.yourdomain.com
