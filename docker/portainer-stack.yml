# Portainer stack for Replex with per-user resolution restrictions,
# exposed via a Cloudflare Tunnel (no open inbound ports on the VPS).
#
# Deploy: Portainer -> Stacks -> Add stack -> Web editor, paste this file.
#
# Secrets live in the stack's Environment variables tab, never inline here.
#
# One-time Cloudflare setup (dashboard):
#   1. Zero Trust -> Networks -> Tunnels -> Create a tunnel (cloudflared)
#   2. Copy the tunnel token
#   3. Public hostname: replex.yourdomain.com -> HTTP -> replex:80
#   4. Security -> Bots: disable Bot Fight Mode (Plex clients get challenged
#      otherwise) and avoid WAF rules that challenge this hostname.

services:
  replex:
    # Prebuilt multi-arch image published by GitHub Actions on every push to
    # main (avoids Portainer's broken in-stack builds). "Update the stack"
    # with "Re-pull image" enabled picks up new versions.
    image: ghcr.io/ljam96/replex:latest
    container_name: replex
    restart: unless-stopped
    # No published ports: the only path in is through the tunnel.
    # Run the container read-only; only the cache volume and a tmpfs are
    # writable. The image runs as an unprivileged UID (see docker/Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - replex-cache:/data
    environment:
      # --- upstream Plex ---
      REPLEX_HOST: ${REPLEX_HOST}
      REPLEX_TOKEN: ${REPLEX_TOKEN}

      # --- per-user resolution restrictions ---
      # These limits are ENFORCED by Replex for any client that reaches Plex
      # through Replex: restricted accounts' streams are proxied through Replex
      # (never 302-redirected to the origin) and unknown/direct part requests
      # are blocked. They are NOT a hard boundary against a client that can
      # reach the Plex origin directly. For hard enforcement, firewall the Plex
      # origin so only Replex can talk to it.
      REPLEX_RESOLUTION_POLICY_ENABLED: "true"
      REPLEX_RESOLUTION_DEFAULT: "unlimited"
      REPLEX_RESOLUTION_POLICY_FAIL_CLOSED: "true"
      REPLEX_HIDDEN_COLLECTIONS: ${REPLEX_HIDDEN_COLLECTIONS}
      REPLEX_USER_RESOLUTION_POLICIES: >-
        ${REPLEX_USER_RESOLUTION_POLICIES}

      # --- presentation / playback behaviour ---
      REPLEX_INTERLEAVE: "true"
      REPLEX_HUB_RESTRICTIONS: "true"
      REPLEX_AUTO_SELECT_VERSION: "true"
      REPLEX_HERO_ROWS: "home.continue"

      # --- transport ---
      # Unlimited accounts' video bytes are 302-redirected straight to the Plex
      # origin for performance. Restricted accounts are ALWAYS proxied through
      # Replex regardless of this flag, so their limit stays enforceable. Set
      # REPLEX_REDIRECT_STREAMS to "false" to proxy every stream through Replex.
      REPLEX_REDIRECT_STREAMS: "true"
      # Optional: extra account tokens for the internal warmer to pre-fetch, so
      # accounts other than REPLEX_TOKEN also get cold-start-free hubs/library.
      # Comma separated; leave empty to warm only the admin token.
      REPLEX_WARM_TOKENS: ${REPLEX_WARM_TOKENS}

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: replex-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - replex

  # Your Plex server takes 45-60s to build merged home/library payloads for
  # large libraries. This sidecar quietly refreshes Replex's cache every
  # 25 minutes so human clients are always served the fast cached copy.
  cache-warmer:
    image: curlimages/curl:8.21.0
    container_name: replex-warmer
    restart: unless-stopped
    depends_on:
      - replex
    entrypoint: >
      sh -c '
      sleep 30;
      while true; do
        curl -sf -m 180 -H "Accept: application/json" -H "X-Plex-Token: $$REPLEX_TOKEN"
          "http://replex:80/hubs/promoted?pinnedContentDirectoryID=23%2C22&count=20" > /dev/null;
        curl -sf -m 180 -H "Accept: application/json" -H "X-Plex-Token: $$REPLEX_TOKEN"
          "http://replex:80/hubs/continueWatching?contentDirectoryID=23%2C22" > /dev/null;
        echo "$(date) cache warmed";
        sleep 1500;
      done'
    environment:
      REPLEX_TOKEN: ${REPLEX_TOKEN}

volumes:
  replex-cache:

# ----------------------------------------------------------------------
# Required environment variables (Portainer stack -> Environment variables):
#
#   REPLEX_HOST   = https://your-plex-host.plex.direct:32400
#   REPLEX_TOKEN  = <your admin plex token>
#   TUNNEL_TOKEN  = <token from Cloudflare Zero Trust tunnel>
#
#   REPLEX_USER_RESOLUTION_POLICIES =
#   [{"username":"alice","max_resolution":"1080","visible_collections":["Kids"]},
#    {"username":"bob","max_resolution":"unlimited"}]
#
#   REPLEX_HIDDEN_COLLECTIONS = Kids
# ----------------------------------------------------------------------
#
# Notes:
# - Video bytes never traverse the tunnel: stream redirection sends clients
#   straight to the bare-metal Plex server for media data.
# - After deploy + tunnel hostname configured, set Plex's Custom server
#   access URL to https://replex.yourdomain.com
