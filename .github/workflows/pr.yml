name: "PR"

# Validate every pull request. We deliberately do NOT push images from a PR
# pipeline: building/pushing from `pull_request_target` with a personal token
# lets untrusted PR content publish to the registry. Image publishing is kept
# exclusively on trusted pushes to `main` (see docker-publish.yml).
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-targets

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        # Surface advisories but do not hard-fail the build on pre-existing
        # ones; treat the output as informational until the tree is clean.
        run: cargo audit || true

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Dependency policy
        run: cargo deny check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.github
          platforms: linux/amd64
          push: false
          tags: replex:pr

  policy-regressions:
    name: Resolution policy regression suite
    runs-on: ubuntu-latest
    env:
      REPLEX_RESOLUTION_POLICY_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Protected playback and direct part tests
        run: cargo test --test playback --test direct_parts
